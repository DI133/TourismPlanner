
<aside class="sidebar">
    <a href="{% url 'accounts:dashboard' %}" class="brand">
        <span class="brand-icon">T</span>
        <span>Tourism<span class="brand-highlight">Planner</span></span>
    </a>

    <div class="sidebar-section">
        <p class="sidebar-label">MENU</p>

        <a href="{% url 'accounts:dashboard' %}"
           class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
            <span>⌂</span>
            Dashboard
        </a>

        <a href="{% url 'places:explore' %}"
           class="nav-item {% if active_page == 'explore' %}active{% endif %}">
            <span>⌖</span>
            Explore
        </a>

        <a href="{% url 'places:saved_places_page' %}"
           class="nav-item {% if active_page == 'saved' %}active{% endif %}">
            <span>♡</span>
            Saved Places
        </a>

        <a href="/trips/"
           class="nav-item {% if active_page == 'trips' %}active{% endif %}">
            <span>▤</span>
            My Trips
        </a>
    </div>

    <div class="sidebar-bottom">
        <div class="sidebar-tip">
            <span class="tip-icon">✦</span>
            <h4>Your next adventure awaits</h4>
            <p>Discover beautiful destinations and plan your next journey.</p>
        </div>

        <form method="POST" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit" class="nav-item logout-link">
                <span>↪</span>
                Logout
            </button>
        </form>
    </div>
</aside>
