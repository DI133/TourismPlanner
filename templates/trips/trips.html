
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Trips | TourismPlanner</title>
    <link rel="stylesheet" href="{% static 'trips/css/trips.css' %}">
    <link rel="stylesheet" href="{% static 'css/sidebar.css' %}">
</head>
<body>


<div class="trips-layout">

    {% include "includes/sidebar.html" with active_page="trips" %}
    
    <main class="trips-main">
    <div class="container">
    <section class="heading">
        <div>
            <p class="eyebrow">YOUR JOURNEYS</p>
            <h1>My Trips</h1>
            <p class="subtitle">Plan your next journey, one day at a time.</p>
        </div>
        <button id="openTripForm" class="primary-button">+ Create Trip</button>
    </section>

    <section id="tripForm" class="trip-form hidden">
        <h2>Create a new trip</h2>

        <form id="createTripForm">
            {% csrf_token %}

            <label for="tripTitle">Trip name</label>
            <input id="tripTitle" type="text"
                   placeholder="e.g. Kerala Adventure" required>

            <div class="date-fields">
                <div>
                    <label for="startDate">Start date</label>
                    <input id="startDate" type="date" required>
                </div>
                <div>
                    <label for="endDate">End date</label>
                    <input id="endDate" type="date" required>
                </div>
            </div>


            <div class="budget-field">
                <label for="tripBudget">Total Trip Budget (₹)</label>
                <input
                    id="tripBudget"
                    type="number"
                    min="0"
                    step="0.01"
                    value="0"
                    placeholder="Enter your planned budget"
                    required
                >
                <small>Set your planned spending limit for this trip.</small>
            </div>


            <div class="form-actions">
                <button type="button" id="cancelTripForm" class="secondary-button">
                    Cancel
                </button>
                <button type="submit" class="primary-button">
                    Create Trip
                </button>
            </div>
        </form>
    </section>

    <p id="message" class="message"></p>

    <section>
        <div id="tripsGrid" class="trips-grid">
            <p>Loading your trips...</p>
        </div>
    </section>
</div>
</main>
</div>

<script src="{% static 'trips/js/trips.js' %}"></script>
</body>
</html>
